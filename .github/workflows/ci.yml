name: Validation Anipic
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
env:
  ONNXRUNTIME_NODE_INSTALL: skip
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run video:build
  docker:
    needs: application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate Compose and optional mounts
        run: node scripts/check-deploy-config.mjs
      - name: Build complete production image
        run: docker build --pull --tag anipic:ci .
      - name: Start production app and render a real clip in disposable storage
        run: docker run --rm --tmpfs /tmp:size=768m --entrypoint node anipic:ci scripts/docker-smoke.mjs
