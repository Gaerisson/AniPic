# Image publiee par le workflow GitHub apres validation complete.
# Conserver la stack, ses volumes et ses chemins NAS existants.
services:
  anipic:
    image: "${ANIPIC_IMAGE:-ghcr.io/gaerisson/anipic:3.14.0}"
    pull_policy: always
    container_name: anipic
    init: true
    restart: unless-stopped
    user: "${ANIPIC_UID:-1000}:${ANIPIC_GID:-1000}"
    ports:
      - "${ANIPIC_BIND_IP:-127.0.0.1}:${ANIPIC_PORT:-8088}:3000"
    environment:
      NODE_ENV: production
      MAX_MEDIA_MB: "${MAX_MEDIA_MB:-512}"
      HOST: 0.0.0.0
      PORT: "3000"
      DB_DIR: /data
      MEDIA_DIR: /media
      CACHE_DIR: /cache
      BACKUP_DIR: /backups
      APP_ORIGIN: "${APP_ORIGIN:-http://localhost:8088}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      VISITOR_COUNTRY_HEADER: "${VISITOR_COUNTRY_HEADER:-}"
      PROXY_TRUSTED_IPS: "${PROXY_TRUSTED_IPS:-127.0.0.1,::1}"
      SOURCE_ALLOWED_HOSTS: "${SOURCE_ALLOWED_HOSTS:-www.la-spa.fr,la-spa.fr,api-spa.gaerisson-softs.fr,srv.gaerisson-softs.fr}"
      DEMO_MODE: "false"
      VIDEO_RENDER_ENABLED: "${VIDEO_RENDER_ENABLED:-true}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.5-flash-lite}"
      TOKENHARBOR_API_KEY: "${TOKENHARBOR_API_KEY:-}"
      TOKENHARBOR_MODEL: "${TOKENHARBOR_MODEL:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      CANVA_CLIENT_ID: "${CANVA_CLIENT_ID:-}"
      CANVA_CLIENT_SECRET: "${CANVA_CLIENT_SECRET:-}"
      CANVA_TOKEN_KEY: "${CANVA_TOKEN_KEY:-}"
      CANVA_REDIRECT_URI: "${CANVA_REDIRECT_URI:-}"
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:-}"
      MISTRAL_TTS_MODEL: "${MISTRAL_TTS_MODEL:-voxtral-mini-tts-2603}"
      MISTRAL_TTS_VOICE_ID: "${MISTRAL_TTS_VOICE_ID:-}"
      REQUIRE_STORAGE_MARKER: "true"
      TZ: Europe/Paris
    volumes:
      - anipic_db:/data
      - anipic_cache:/cache
      - type: bind
        source: "${ANIPIC_MEDIA_PATH:?Définir le chemin NAS photos}"
        target: /media
        bind:
          create_host_path: false
      - type: bind
        source: "${ANIPIC_BACKUP_PATH:?Définir le chemin NAS sauvegardes}"
        target: /backups
        bind:
          create_host_path: false
    read_only: true
    tmpfs: ["/tmp:size=512m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: "${ANIPIC_MEMORY_LIMIT:-2g}"
    cpus: 2
    stop_grace_period: 60s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
volumes:
  anipic_db:
  anipic_cache:
