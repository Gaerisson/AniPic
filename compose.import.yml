# docker compose -f compose.yml -f compose.import.yml up -d
services:
  anipic:
    environment:
      IMPORT_DIR: /imports
    volumes:
      - type: bind
        source: "${ANIPIC_IMPORT_PATH:?Définir ANIPIC_IMPORT_PATH vers vos exports Lightroom/Photoshop}"
        target: /imports
        # Les exports traités sont retirés après vérification de leur copie AniPic.
        read_only: false
        bind:
          create_host_path: false
