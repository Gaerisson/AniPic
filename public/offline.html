<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#121315" />
    <title>AniPic · Connexion indisponible</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #121315;
        color: #fff7ef;
        font:
          16px/1.7 system-ui,
          sans-serif;
      }
      main {
        max-width: 420px;
        padding: 32px;
      }
      img {
        width: 76px;
        height: 76px;
      }
      h1 {
        font-size: 32px;
        line-height: 1.15;
      }
      p {
        color: #c8c1bb;
      }
      button {
        display: inline-block;
        margin-top: 14px;
        padding: 12px 24px;
        background: #f4833c;
        color: #16120f;
        border-radius: 14px;
        text-decoration: none;
        font-weight: 650;
        border: 0;
        font: inherit;
        cursor: pointer;
      }
      small {
        display: block;
        margin-top: 36px;
        color: #b4aba3;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/anipic-icon.svg" alt="AniPic" />
      <h1>Le refuge reste à portée de main.</h1>
      <p>
        La connexion au serveur est indisponible. Retrouvez les adoptions, vos
        photos et C8 dès que votre connexion sera rétablie.
      </p>
      <p>
        Les données de l’équipe et les vidéos ne sont pas enregistrées par
        l’application pour un accès hors ligne.
      </p>
      <form id="retry-form" action="/#mobile" method="get">
        <input type="hidden" name="app" value="android" /><button type="submit">
          Réessayer
        </button>
      </form>
      <small>© Gaerisson · AniPic</small>
    </main>
    <script src="/offline-retry.js" defer></script>
  </body>
</html>
